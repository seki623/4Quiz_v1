<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズアプリ</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #quiz-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 90%; max-width: 500px; }
        
        /* タイトル・開始画面 */
        .title-text { text-align: center; color: #333; margin-bottom: 30px; font-size: 1.5rem; }
        .mode-select-box { display: flex; flex-direction: column; gap: 15px; }
        .start-btn { padding: 15px; font-size: 1.1rem; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; text-align: center; transition: background 0.2s; }
        #easy-btn { background: #28a745; }
        #easy-btn:hover { background: #218838; }
        #normal-btn { background: #fd7e14; }
        #normal-btn:hover { background: #e0660d; }

        /* 進捗表示エリア */
        #progress-container { margin-bottom: 20px; }
        #progress-text { font-size: 0.85rem; color: #666; text-align: right; margin-bottom: 5px; }
        #progress-bar-bg { background: #eee; height: 10px; border-radius: 5px; overflow: hidden; }
        #progress-bar-fill { background: #007bff; height: 100%; width: 0%; transition: width 0.3s ease; }

        h2 { font-size: 1.2rem; line-height: 1.5; margin: 10px 0 20px; }
        #choices { display: flex; flex-direction: column; gap: 10px; }
        button { padding: 12px; font-size: 1rem; cursor: pointer; border: 2px solid #ddd; border-radius: 8px; background: #fff; transition: all 0.2s; text-align: left; }
        button:disabled { color: #333; cursor: default; }
        
        #explanation-container { margin-top: 20px; padding: 15px; background: #f1f7ff; border-radius: 10px; border-left: 5px solid #007bff; display: none; }
        #result-text { font-weight: bold; margin-bottom: 10px; }
        #next-btn { width: 100%; margin-top: 15px; background: #007bff; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; }

        /* コントロールボタンのエリア */
        #control-panel { display: flex; gap: 10px; margin-top: 25px; padding-top: 15px; border-top: 1px dashed #ddd; justify-content: space-between; flex-wrap: wrap; }
        .ctrl-btn { padding: 8px 12px; font-size: 0.8rem; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; flex: 1; text-align: center; min-width: 80px; }
        .ctrl-btn:hover { background: #5a6268; }
        .ctrl-btn:disabled { background: #ccc; cursor: not-allowed; display: none; }
        #quit-btn { background: #dc3545; } /* 途中終了は赤色に */
        #quit-btn:hover { background: #bd2130; }
    </style>
</head>
<body>

<div id="quiz-container">
    <!-- 最初はここに開始画面かクイズ画面がJavaScriptで入ります -->
</div>

<script src="script.js"></script>
</body>
</html>
